services:
  - type: web
    name: fitnorius-backend
    env: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAME_SITE
        value: None
      - key: MYSQL_USE_SSL
        value: "true"
      - key: MYSQL_REQUIRE_SSL
        value: "true"
      - key: MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false