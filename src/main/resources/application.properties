# ========================
# MySQL (Railway)
# ? Usa las variables de Railway:
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=${MYSQL_USE_SSL:true}&requireSSL=${MYSQL_REQUIRE_SSL:true}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:}
spring.datasource.password=${MYSQLPASSWORD:}

# ========================
# \uD83D\uDD39 JPA / Hibernate (optimizado sin romper nada)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================
# \uD83D\uDD39 Puerto (Railway)
server.port=${PORT:8080}

# ========================
# \uD83D\uDD39 WhatsApp API (Meta Cloud)
whatsapp.api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0/YOUR_PHONE_NUMBER_ID/messages}
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.phone.number=${WHATSAPP_PHONE_NUMBER:}


# ========================
# \uD83D\uDD39 Recursos est\u00E1ticos y subida de archivos
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# \uD83D\uDD39 Actuator (evita spam de logs)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ========================
# \uD83D\uDD39 Compresi\u00F3n HTTP (performance)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# ========================
# \uD83D\uDD39 Cloudinary (SEGURO)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}


# ========================
# \uD83D\uDD39 Logging (Railway friendly)
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.com.camilo=WARN
logging.level.com.camilo.fitnorius=INFO

# ========================
# Seguridad / JWT
# ========================
# Configurar ADMIN_PASSWORD_HASH (preferido) o ADMIN_PASSWORD en el entorno.
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password-hash=${ADMIN_PASSWORD_HASH:}
app.security.admin.password=${ADMIN_PASSWORD:}

# JWT_SECRET debe ser un valor Base64 de al menos 32 bytes.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:fitnorius-api}
app.security.jwt.audience=${JWT_AUDIENCE:fitnorius-frontend}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
app.security.jwt.refresh-reuse-grace=${JWT_REFRESH_REUSE_GRACE:10s}
app.security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:fitnorius_refresh}
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:None}

# Lista separada por comas; no se permiten comodines con credenciales.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Límite básico de intentos de login por usuario/IP.
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.ip-max-attempts=${LOGIN_IP_MAX_ATTEMPTS:30}
app.security.login.window=${LOGIN_ATTEMPT_WINDOW:15m}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:15m}

# La autenticación se realiza exclusivamente con el servicio JWT; no se genera
# una contraseña aleatoria de Spring ni se expone un login básico.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ========================
# HTTP / proxies
# ========================
# No confiar automáticamente en cabeceras X-Forwarded-*; ClientIpResolver
# solo las acepta cuando la conexión inmediata es un proxy conocido.
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
